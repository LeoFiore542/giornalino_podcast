<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Giornalino & Podcast{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">Voce di Scuola</a>
    <nav class="site-nav" aria-label="Principale">
      <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}is-active{% endif %}">Home</a>
      <a href="{{ url_for('giornalino') }}" class="{% if request.endpoint == 'giornalino' %}is-active{% endif %}">Giornalino</a>
      <a href="{{ url_for('podcast') }}" class="{% if request.endpoint == 'podcast' %}is-active{% endif %}">Podcast</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Giornalino e podcast della scuola — scheletro di progetto</p>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
